name: Harmony AI Coach Verify

on:
  push:
    branches:
      - feat/harmony-ai-coach
  pull_request:
    paths:
      - 'app/src/main/java/com/example/ai/**'
      - 'app/src/main/java/com/example/ui/HarmonyCoachViewModel.kt'
      - 'app/src/main/java/com/example/ui/screens/ChatScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/HarmonyCoachPanel.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/test/java/com/example/ai/**'
      - '.github/workflows/harmony-ai-coach-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace
