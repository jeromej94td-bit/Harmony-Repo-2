name: Scenario Adventure Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/ui/screens/ScenarioAdventurePolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/ScenarioAdventureBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenQuestionMechanicBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/RunnerSkipButton.kt'
      - 'app/src/test/java/com/example/ui/screens/ScenarioAdventurePolicyTest.kt'
      - 'app/src/test/java/com/example/ui/screens/ScenarioAdventureRoutingContractTest.kt'
      - '.github/workflows/scenario-adventure-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenario-adventure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Isolate scenario tests from known-red unrelated test sources
        run: |
          rm -f app/src/test/java/com/example/developer/DeveloperFeedbackPayloadTest.kt
          rm -f app/src/test/java/com/example/ui/screens/WhoWouldPandaSceneTest.kt

      - name: Run scenario adventure tests
        run: >-
          gradle :app:testDebugUnitTest
          --tests com.example.ui.screens.ScenarioAdventurePolicyTest
          --tests com.example.ui.screens.ScenarioAdventureRoutingContractTest
          --stacktrace
          --no-daemon
          --no-configuration-cache
