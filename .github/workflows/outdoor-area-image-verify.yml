name: Outdoor Area Image Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/data/GeneratedHarmonyContent.kt'
      - 'app/src/main/java/com/example/data/DriveTotAssetInstaller.kt'
      - 'app/src/main/assets/outdoor_aussenpool.b64'
      - 'app/src/main/assets/outdoor_whirlpool.b64'
      - 'app/src/test/java/com/example/OutdoorAreaImageContractTest.kt'
      - '.github/workflows/outdoor-area-image-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run outdoor area image contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests com.example.OutdoorAreaImageContractTest
          --stacktrace
          --no-daemon
          --no-configuration-cache
