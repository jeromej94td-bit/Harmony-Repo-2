name: Current App State Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/main/java/com/example/ui/HarmonyViewModel.kt'
      - 'app/src/main/java/com/example/ui/screens/ProfileSheet.kt'
      - 'app/src/main/java/com/example/ui/screens/PartnerConnectionSheet.kt'
      - 'app/src/main/java/com/example/ui/screens/ChatScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/ChatScreenLegacyBridge.kt'
      - 'app/src/main/java/com/example/ui/screens/HomeScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/GamesScreen.kt'
      - 'app/src/main/java/com/example/data/model/Models.kt'
      - 'app/src/main/java/com/example/data/model/RemovedGameCatalogPolicy.kt'
      - 'app/src/main/java/com/example/**/KidGenerator*.kt'
      - 'app/src/main/java/com/example/data/SupabaseKidGeneratorGateway.kt'
      - 'app/src/test/java/com/example/CurrentAppStateContractTest.kt'
      - 'app/src/test/java/com/example/EureMischungRemovalContractTest.kt'
      - 'app/src/test/java/com/example/RealUserProfileAndBrainRemovalContractTest.kt'
      - '.github/workflows/current-app-state-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/main/java/com/example/ui/HarmonyViewModel.kt'
      - 'app/src/main/java/com/example/ui/screens/ProfileSheet.kt'
      - 'app/src/main/java/com/example/ui/screens/PartnerConnectionSheet.kt'
      - 'app/src/main/java/com/example/ui/screens/ChatScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/ChatScreenLegacyBridge.kt'
      - 'app/src/main/java/com/example/ui/screens/HomeScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/GamesScreen.kt'
      - 'app/src/main/java/com/example/data/model/Models.kt'
      - 'app/src/main/java/com/example/data/model/RemovedGameCatalogPolicy.kt'
      - 'app/src/main/java/com/example/**/KidGenerator*.kt'
      - 'app/src/main/java/com/example/data/SupabaseKidGeneratorGateway.kt'
      - 'app/src/test/java/com/example/CurrentAppStateContractTest.kt'
      - 'app/src/test/java/com/example/EureMischungRemovalContractTest.kt'
      - 'app/src/test/java/com/example/RealUserProfileAndBrainRemovalContractTest.kt'
      - '.github/workflows/current-app-state-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-app-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify current production app state
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.CurrentAppStateContractTest'
          --tests 'com.example.EureMischungRemovalContractTest'
          --tests 'com.example.RealUserProfileAndBrainRemovalContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
