name: Quiz No Scroll TEMP

on:
  push:
    branches:
      - fix/quiz-no-scroll-current
    paths:
      - 'app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/StandardQuizLayoutPolicy.kt'
      - 'app/src/test/java/com/example/QuizNoScrollContractTest.kt'
      - '.github/workflows/quiz-no-scroll-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-no-scroll-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run focused quiz layout regression
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.QuizNoScrollContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
