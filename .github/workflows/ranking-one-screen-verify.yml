name: Ranking one-screen verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/ui/screens/RankingSlotBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/RunnerSkipButton.kt'
      - 'app/src/test/java/com/example/ui/screens/RankingOneScreenContractTest.kt'
      - '.github/workflows/ranking-one-screen-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranking-one-screen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run ranking one-screen contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests com.example.ui.screens.RankingOneScreenContractTest
          --stacktrace
          --no-daemon
          --no-configuration-cache
