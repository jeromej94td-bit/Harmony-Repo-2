name: Proposal Location Duel Verification

on:
  push:
    branches:
      - 360-rework/24-8-proposal-location-duels
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/data/model/ProposalLocationDuels.kt'
      - 'app/src/main/java/com/example/ui/screens/ProposalLocationDuelBoard.kt'
      - 'app/src/main/res/drawable-nodpi/proposal_location_*.webp'
      - 'app/src/test/java/com/example/ui/screens/ProposalLocationDuelBoardTest.kt'
      - '.github/workflows/proposal-location-duel-verify.yml'

permissions:
  contents: read

jobs:
  proposal-location-duel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create ephemeral debug keystore
        run: >-
          keytool -genkeypair -v
          -keystore debug.keystore
          -storepass android
          -alias androiddebugkey
          -keypass android
          -dname "CN=Android Debug,O=Android,C=US"
          -keyalg RSA
          -keysize 2048
          -validity 10000

      - name: Run proposal location duel tests
        run: gradle :app:testDebugUnitTest --tests 'com.example.ui.screens.ProposalLocationDuelBoardTest' --stacktrace

      - name: Assemble debug APK
        if: success()
        run: gradle :app:assembleDebug --stacktrace
