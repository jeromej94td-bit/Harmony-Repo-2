name: Temporary Introspection results back patch

on:
  push:
    branches:
      - fix/introspection-results-visible-back

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/introspection-results-visible-back
          fetch-depth: 0
      - name: Apply focused source patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/ui/screens/IntrospectionGameScreen.kt")
          text = path.read_text()

          if 'modifier = Modifier.testTag("results_back_button")' in text:
              raise SystemExit(0)

          call_old = """                        activeStage = activeAnswerStage,
                        onPlayAnswer = { file, stage ->"""
          call_new = """                        activeStage = activeAnswerStage,
                        onBackRequest = { goBackOneQuestion() },
                        onPlayAnswer = { file, stage ->"""
          assert text.count(call_old) == 1, "ResultsScreen call anchor changed"
          text = text.replace(call_old, call_new, 1)

          signature_old = """    activeStage: IntrospectionStage?,
    onPlayAnswer: (File, IntrospectionStage) -> Unit,"""
          signature_new = """    activeStage: IntrospectionStage?,
    onBackRequest: () -> Unit,
    onPlayAnswer: (File, IntrospectionStage) -> Unit,"""
          assert text.count(signature_old) == 1, "ResultsScreen signature anchor changed"
          text = text.replace(signature_old, signature_new, 1)

          body_old = """    ) {
        Text(
            text = IntrospectionConstants.WIZARD_EMOJI,
            fontSize = 40.sp
        )"""
          body_new = """    ) {
        Row(
            modifier = Modifier.fillMaxWidth(),
            horizontalArrangement = Arrangement.Start
        ) {
            IconButton(
                onClick = onBackRequest,
                modifier = Modifier.testTag(\"results_back_button\")
            ) {
                Icon(
                    imageVector = Icons.AutoMirrored.Filled.ArrowBack,
                    contentDescription = IntrospectionStrings.tr(
                        IntrospectionStringKey.BACK_BUTTON_CD,
                        appLang
                    ),
                    tint = IntrospectionColors.PrimaryText
                )
            }
        }

        Spacer(Modifier.height(6.dp))

        Text(
            text = IntrospectionConstants.WIZARD_EMOJI,
            fontSize = 40.sp
        )"""
          results_start = text.index("private fun ResultsScreen(")
          prefix = text[:results_start]
          results = text[results_start:]
          assert results.count(body_old) == 1, "ResultsScreen body anchor changed"
          results = results.replace(body_old, body_new, 1)
          path.write_text(prefix + results)
      - name: Commit focused patch
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/example/ui/screens/IntrospectionGameScreen.kt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/IntrospectionGameScreen.kt
          git commit -m "fix: Zurück auf Introspection-Ergebnis verdrahten"
          git push origin HEAD:fix/introspection-results-visible-back
