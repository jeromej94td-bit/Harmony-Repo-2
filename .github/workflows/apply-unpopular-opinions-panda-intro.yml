name: Apply Unpopular Opinions Panda Intro

on:
  push:
    branches:
      - feat/unpopular-opinions-panda-video
    paths:
      - 'scripts/apply_unpopular_opinions_panda_intro.py'
      - '.github/workflows/apply-unpopular-opinions-panda-intro.yml'
      - 'app/src/main/res/raw/unpopular_opinions_panda_intro.mp4'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unpopular-opinions-panda-video
          fetch-depth: 0

      - name: Apply focused Panda video integration
        run: python3 scripts/apply_unpopular_opinions_panda_intro.py

      - name: Verify focused integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt').read_text(encoding='utf-8')
          required = [
              'private fun UnpopularOpinionsPandaIntro(',
              'R.raw.unpopular_opinions_panda_intro',
              'pack.id == "unbeliebt" && showUnpopularOpinionsIntro',
              'mutableStateOf(pack.id == "unbeliebt")',
          ]
          missing = [item for item in required if item not in screen]
          if missing:
              raise SystemExit(f'Missing integration markers: {missing}')
          video = Path('app/src/main/res/raw/unpopular_opinions_panda_intro.mp4')
          if not video.exists() or video.stat().st_size < 100_000:
              raise SystemExit('Panda intro video resource missing or unexpectedly small')
          print('Panda intro integration verified')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit verified implementation
        run: |
          git config user.name "harmony-panda-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_unpopular_opinions_panda_intro.py .github/workflows/apply-unpopular-opinions-panda-intro.yml
          git add app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt app/src/main/res/raw/unpopular_opinions_panda_intro.mp4
          git commit -m "feat: play Panda intro for unpopular opinions"
          git push origin HEAD:feat/unpopular-opinions-panda-video
