name: Memory Widget Verification

on:
  push:
    branches:
      - feat/memory-home-widget
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/widget/**'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/main/java/com/example/data/db/MemoryDao.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/drawable/widget_memory_*'
      - 'app/src/main/res/layout/widget_memory*'
      - 'app/src/main/res/xml/memory_widget_info.xml'
      - 'app/src/main/res/values/strings.xml'
      - 'app/src/test/java/com/example/widget/**'
      - '.github/workflows/memory-widget-verify.yml'

permissions:
  contents: read

jobs:
  widget-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run memory widget migration gate
        run: gradle :app:testDebugUnitTest --tests 'com.example.widget.MemoryWidgetMigrationTest' --stacktrace

      - name: Run all memory widget tests
        if: success()
        run: gradle :app:testDebugUnitTest --tests 'com.example.widget.MemoryWidget*Test' --stacktrace

      - name: Create ephemeral debug keystore
        if: success()
        run: >-
          keytool -genkeypair -v
          -keystore debug.keystore
          -storepass android
          -alias androiddebugkey
          -keypass android
          -dname "CN=Android Debug,O=Android,C=US"
          -keyalg RSA
          -keysize 2048
          -validity 10000

      - name: Assemble debug APK
        if: success()
        run: gradle :app:assembleDebug --stacktrace
