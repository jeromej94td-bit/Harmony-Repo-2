name: Developer Feedback Payload TEMP

on:
  push:
    branches:
      - fix/developer-feedback-payload-test-import
    paths:
      - 'app/src/test/java/com/example/developer/DeveloperFeedbackPayloadTest.kt'
      - '.github/workflows/developer-feedback-payload-test-temp.yml'

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify developer feedback payload contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.developer.DeveloperFeedbackPayloadTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
