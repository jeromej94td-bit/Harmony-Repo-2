name: Android main verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-main-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-main-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Create ephemeral main-verification keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Harmony Main Verification,O=Harmony,C=DE"

      - name: Compile Harmony from merged main
        run: gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
