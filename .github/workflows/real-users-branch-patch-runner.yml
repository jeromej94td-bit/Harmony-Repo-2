name: Real users branch patch runner

on:
  push:
    branches:
      - feat/real-users-couples-foundation
    paths:
      - 'automation-patches/*.patch'

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued implementation patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(automation-patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for patch in "${patches[@]}"; do
            if grep -q '^@@ -' "$patch"; then
              git apply --recount "$patch"
            elif grep -q '^diff --git ' "$patch"; then
              python3 - "$patch" <<'PY'
          from pathlib import Path
          import re
          import sys

          patch_path = Path(sys.argv[1])
          lines = patch_path.read_text().splitlines()
          i = 0
          while i < len(lines):
              if not lines[i].startswith('diff --git a/'):
                  i += 1
                  continue
              match = re.match(r'diff --git a/(.+?) b/(.+)', lines[i])
              if not match:
                  raise SystemExit(f'Invalid diff header in {patch_path}: {lines[i]}')
              target = Path(match.group(2))
              i += 1
              while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('diff --git a/'):
                  i += 1
              text = target.read_text()
              while i < len(lines) and not lines[i].startswith('diff --git a/'):
                  if not lines[i].startswith('@@'):
                      i += 1
                      continue
                  i += 1
                  old_lines = []
                  new_lines = []
                  while i < len(lines) and not lines[i].startswith('@@') and not lines[i].startswith('diff --git a/'):
                      line = lines[i]
                      if line.startswith(' '):
                          old_lines.append(line[1:])
                          new_lines.append(line[1:])
                      elif line.startswith('-'):
                          old_lines.append(line[1:])
                      elif line.startswith('+'):
                          new_lines.append(line[1:])
                      else:
                          raise SystemExit(f'Unsupported simplified hunk line in {patch_path}: {line!r}')
                      i += 1
                  old = '\n'.join(old_lines)
                  new = '\n'.join(new_lines)
                  matches = text.count(old)
                  if matches != 1:
                      raise SystemExit(f'{target}: expected exactly one match for hunk, found {matches}: {old[:160]!r}')
                  text = text.replace(old, new, 1)
              target.write_text(text)
          PY
            fi
            git add -A
            git rm "$patch"
          done
          git commit -m 'chore: apply queued real-user implementation patch'
          git push origin "HEAD:${GITHUB_REF_NAME}"
