name: Question mechanics audit

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/example/data/**'
      - 'app/src/main/java/com/example/ui/screens/**'
      - 'app/src/test/java/com/example/data/**'
      - 'app/src/test/java/com/example/ui/screens/**'
      - '.github/workflows/question-mechanics-audit.yml'
  workflow_dispatch:

jobs:
  focused-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run focused question mechanics tests
        run: >-
          gradle :app:testDebugUnitTest
          --stacktrace
          --tests 'com.example.data.QuestionMechanicsAuditTest'
          --tests 'com.example.data.model.DynamicQuestionMechanicsTest'
          --tests 'com.example.data.model.LegacyWhoWouldRoutingTest'
          --tests 'com.example.data.model.QuestionInteractionTest'
          --tests 'com.example.data.model.QuestionResponseCurationTest'
          --tests 'com.example.data.model.QuestionStableMechanicRoutingTest'
          --tests 'com.example.ui.screens.PhotoQuestionPolicyTest'
          --tests 'com.example.ui.screens.PhotoQuestionRoutingTest'
          --tests 'com.example.ui.screens.QuizAnswerOptionsPolicyTest'
          --tests 'com.example.ui.screens.StableSpecialQuestionRoutingTest'
