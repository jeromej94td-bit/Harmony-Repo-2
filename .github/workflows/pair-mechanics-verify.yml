name: Pair Mechanics Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/ui/screens/FullscreenPairMechanics.kt'
      - 'app/src/main/java/com/example/ui/screens/PrivatePairRevealBoards.kt'
      - 'app/src/main/java/com/example/ui/screens/ScaleWhoWouldReworkBoards.kt'
      - 'app/src/main/java/com/example/ui/screens/WhoWouldLayoutPolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/ExperiencePartnerPredictionBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenMechanicCommon.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenQuestionMechanicBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/QuizRunnerScreen.kt'
      - 'app/src/test/java/com/example/PairRevealFlowContractTest.kt'
      - 'app/src/test/java/com/example/PairPredictionProgressTest.kt'
      - '.github/workflows/pair-mechanics-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pair-mechanics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run pair mechanic tests
        run: >-
          gradle :app:testDebugUnitTest
          --tests com.example.PairRevealFlowContractTest
          --tests com.example.PairPredictionProgressTest
          --stacktrace
          --no-daemon
          --no-configuration-cache
