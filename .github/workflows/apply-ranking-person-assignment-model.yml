name: Apply ranking interaction model

on:
  push:
    branches:
      - feat/ranking-person-assignment

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, 'feat: add ranking interaction model') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ranking-person-assignment
          fetch-depth: 0

      - name: Apply model patch
        run: git apply --check .github/patches/ranking-person-assignment-model.patch && git apply .github/patches/ranking-person-assignment-model.patch

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run interaction tests
        run: gradle :app:test --tests com.example.data.model.QuestionInteractionTest --stacktrace

      - name: Run full unit test suite
        run: gradle :app:test --stacktrace

      - name: Commit model implementation
        run: |
          rm -f .github/patches/ranking-person-assignment-model.patch
          rm -f .github/workflows/apply-ranking-person-assignment-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add ranking interaction model"
          git push origin HEAD:feat/ranking-person-assignment
