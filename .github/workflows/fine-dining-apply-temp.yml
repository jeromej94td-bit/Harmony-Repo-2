name: Fine Dining Apply TEMP

on:
  push:
    branches:
      - feature/fine-dining-visual-ranking
    paths:
      - 'tools/apply_fine_dining_visual_ranking.py'
      - '.github/workflows/fine-dining-apply-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fine-dining-visual-ranking
          fetch-depth: 0
      - name: Apply scoped source patch
        run: python tools/apply_fine_dining_visual_ranking.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/screens/RankingSlotBoard.kt
          git commit -m "feat: render Fine Dining ranking as visual cards"
          git push origin HEAD:feature/fine-dining-visual-ranking
