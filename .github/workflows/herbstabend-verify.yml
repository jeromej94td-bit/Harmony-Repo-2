name: Herbstabend Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/data/model/Models.kt'
      - 'app/src/main/java/com/example/ui/AutumnEveningEnglishContent.kt'
      - 'app/src/main/java/com/example/ui/TranslationCatalog.kt'
      - 'app/src/main/java/com/example/ui/screens/AutumnEveningQuestion.kt'
      - 'app/src/main/java/com/example/ui/screens/HarmonyImageChoicePolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/HarmonyImageChoiceQuestion.kt'
      - 'app/src/main/res/drawable-nodpi/autumn_*.png'
      - 'app/src/test/java/com/example/data/model/AutumnEveningPackContractTest.kt'
      - 'app/src/test/java/com/example/ui/AutumnEveningTranslationTest.kt'
      - 'app/src/test/java/com/example/ui/screens/AutumnEvening*.kt'
      - '.github/workflows/herbstabend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herbstabend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Run Herbstabend core contracts
        id: core
        continue-on-error: true
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.data.model.AutumnEveningPackContractTest'
          --tests 'com.example.ui.screens.AutumnEveningAssetContractTest'
          --tests 'com.example.ui.screens.AutumnEveningImageChoicePolicyTest'
          --tests 'com.example.ui.screens.AutumnEveningRendererContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Run Herbstabend translation contract
        id: translation
        continue-on-error: true
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.AutumnEveningTranslationTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Run Herbstabend visual contract
        id: visual
        continue-on-error: true
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.screens.AutumnEveningVisualContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Compile debug Kotlin
        id: compile
        continue-on-error: true
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache

      - name: Enforce Herbstabend verification
        if: always()
        env:
          CORE: ${{ steps.core.outcome }}
          TRANSLATION: ${{ steps.translation.outcome }}
          VISUAL: ${{ steps.visual.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
        run: |
          echo "core=$CORE translation=$TRANSLATION visual=$VISUAL compile=$COMPILE"
          test "$CORE" = success
          test "$TRANSLATION" = success
          test "$VISUAL" = success
          test "$COMPILE" = success
