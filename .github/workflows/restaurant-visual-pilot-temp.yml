name: Restaurant Visual Pilot TEMP

on:
  push:
    branches:
      - feature/restaurant-choice-visual-pilot
    paths:
      - 'app/src/main/java/com/example/ui/screens/RestaurantChoiceVisualPilot.kt'
      - 'app/src/main/java/com/example/ui/screens/DirectPriorityPokerBoard.kt'
      - 'app/src/main/res/drawable/restaurant_revisit_visual_atlas.webp'
      - 'app/src/test/java/com/example/ui/screens/RestaurantChoiceVisualPilotContractTest.kt'
      - '.github/workflows/restaurant-visual-pilot-temp.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Compile production Kotlin
        run: >-
          gradle :app:compileDebugKotlin
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Verify restaurant visual pilot source and artwork contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual = Path('app/src/main/java/com/example/ui/screens/RestaurantChoiceVisualPilot.kt').read_text()
          board = Path('app/src/main/java/com/example/ui/screens/DirectPriorityPokerBoard.kt').read_text()
          curation = Path('app/src/main/java/com/example/data/Harmony360FoodSectionCuration.kt').read_text()
          atlas = Path('app/src/main/res/drawable/restaurant_revisit_visual_atlas.webp').read_bytes()

          required_visual = [
              'Was wäre für dich der größte Grund, ein Restaurant nicht wieder zu besuchen?',
              'Euer Date läuft – was würde dir den Abend am schnellsten verderben?',
              'Essen enttäuscht',
              'Schlechter Service',
              'Zu laut',
              'Preis passt nicht',
              'RestaurantChoiceVisualThumbnail',
              'R.drawable.restaurant_revisit_visual_atlas',
              'LaunchedEffect',
              'delay(',
              'revealedCount',
              'inputLocked',
              'AnimatedVisibility',
              'enabled = revealed && !inputLocked',
          ]
          for token in required_visual:
              assert token in visual, token

          assert 'restaurantChoiceVisualSpec' in board
          assert 'RestaurantChoiceVisualGrid' in board

          for raw in ['Essen enttäuscht', 'Schlechter Service', 'Zu laut', 'Preis passt nicht']:
              assert f'"{raw}"' in curation, raw

          assert 'Was entscheidet bei der Restaurantwahl zuerst?' not in visual
          assert 'Was soll bei einem Date-Restaurant am stärksten sein?' not in visual

          assert 100_000 < len(atlas) < 800_000, len(atlas)
          assert atlas[:4] == b'RIFF', atlas[:4]
          assert atlas[8:12] == b'WEBP', atlas[8:12]
          print(f'Restaurant visual pilot contract: PASS ({len(atlas)} byte WEBP)')
          PY
