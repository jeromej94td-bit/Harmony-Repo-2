name: Restaurant Visual Pilot TEMP

on:
  push:
    branches:
      - feature/restaurant-choice-visual-pilot
    paths:
      - 'app/src/main/java/com/example/ui/screens/RestaurantChoiceVisualPilot.kt'
      - 'app/src/main/java/com/example/ui/screens/DirectPriorityPokerBoard.kt'
      - 'app/src/main/res/drawable/restaurant_revisit_visual_atlas.webp'
      - 'app/src/test/java/com/example/ui/screens/RestaurantChoiceVisualPilotContractTest.kt'
      - '.github/workflows/restaurant-visual-pilot-temp.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify restaurant visual pilot contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.screens.RestaurantChoiceVisualPilotContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Show focused test diagnostics
        if: failure()
        run: |
          find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -print || true
          cat app/build/test-results/testDebugUnitTest/TEST-com.example.ui.screens.RestaurantChoiceVisualPilotContractTest.xml || true
