name: Ring TOT Assets TEMP

on:
  push:
    branches:
      - fix/ring-tot-semantic-assets-current
    paths:
      - 'app/src/main/res/drawable/ring_*.webp'
      - 'app/src/main/res/drawable/ring_*.xml'
      - 'app/src/test/java/com/example/RingTotSemanticAssetsContractTest.kt'
      - '.github/workflows/ring-tot-assets-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-tot-assets-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify semantic ring assets
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.RingTotSemanticAssetsContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
