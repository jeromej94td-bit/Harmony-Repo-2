name: Herbstabend English Translation TEMP

on:
  push:
    branches:
      - fix/herbstabend-english-localization
    paths:
      - 'app/src/main/java/com/example/ui/AutumnEveningEnglishContent.kt'
      - 'app/src/main/java/com/example/ui/TranslationCatalog.kt'
      - 'app/src/test/java/com/example/ui/AutumnEveningTranslationTest.kt'
      - '.github/workflows/herbstabend-english-translation-temp.yml'

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify Herbstabend English localization
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.AutumnEveningTranslationTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
