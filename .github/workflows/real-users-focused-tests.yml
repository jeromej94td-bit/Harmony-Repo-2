name: Real users focused tests

on:
  push:
    branches:
      - feat/real-users-couples-foundation
    paths:
      - 'automation-tests/trigger.txt'

permissions:
  contents: read

jobs:
  focused-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run real-user foundation tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.example.BrainFreezeContractTest \
            --tests com.example.AppSessionModelTest \
            --tests com.example.AccountCacheBoundaryTest \
            --stacktrace
