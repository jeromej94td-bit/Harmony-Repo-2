name: Real users focused tests

on:
  push:
    branches:
      - feat/real-users-couples-foundation
    paths:
      - 'automation-tests/trigger.txt'

permissions:
  contents: read

jobs:
  focused-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run real-user foundation tests
        shell: bash
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.example.BrainFreezeContractTest \
            --tests com.example.AppSessionModelTest \
            --tests com.example.AccountCacheBoundaryTest \
            --tests com.example.PartnerConnectionContractTest \
            --tests com.example.AccountLifecycleContractTest \
            --stacktrace
