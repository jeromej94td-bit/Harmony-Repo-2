name: Herz oder Kopf Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/example/data/GeneratedHarmonyHeartOrHead.kt'
      - 'app/src/main/java/com/example/data/GeneratedContentRegistry.kt'
      - 'app/src/main/java/com/example/ui/screens/HarmonyImageChoicePolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/HeartOrHeadQuestion.kt'
      - 'app/src/main/java/com/example/ui/screens/AutumnEveningQuestion.kt'
      - 'app/src/main/res/drawable/heart_head_*.xml'
      - 'app/src/main/res/drawable-nodpi/heart_head_*'
      - 'app/src/test/java/com/example/data/model/HeartOrHeadPackContractTest.kt'
      - 'app/src/test/java/com/example/ui/screens/HeartOrHead*.kt'
      - '.github/workflows/herz-oder-kopf-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herz-oder-kopf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Core contracts
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest \
            --tests 'com.example.data.model.HeartOrHeadPackContractTest' \
            --tests 'com.example.ui.screens.HeartOrHeadImageChoicePolicyTest' \
            --tests 'com.example.ui.screens.HeartOrHeadTransitionPolicyTest' \
            --tests 'com.example.ui.screens.HeartOrHeadAssetContractTest' \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache 2>&1 | tee core-contracts.log

      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-or-head-core-diagnostics
          path: core-contracts.log
          if-no-files-found: error

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache

      - name: Visual preview contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.screens.HeartOrHeadVisualContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-or-head-previews
          path: build/outputs/roborazzi/heart_or_head_*_preview.png
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
