name: Profile Avatar Contract TEMP

on:
  push:
    branches:
      - feature/profile-avatars-person-cards

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase-backed profile-avatar contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repository = Path('app/src/main/java/com/example/data/session/AppSessionRepository.kt').read_text()
          session_vm = Path('app/src/main/java/com/example/ui/session/AppSessionViewModel.kt').read_text()
          main = Path('app/src/main/java/com/example/MainActivity.kt').read_text()
          who = Path('app/src/main/java/com/example/ui/screens/ScaleWhoWouldReworkBoards.kt').read_text()

          required_repo = [
              'storage/v1/object/harmony-avatars',
              'update_harmony_avatar',
              'harmony-avatar:',
              'x-upsert',
          ]
          for token in required_repo:
              assert token in repository, f'AppSessionRepository missing: {token}'

          assert 'fun updateProfileAvatar(uri: Uri)' in session_vm, 'AppSessionViewModel missing real-avatar update entrypoint'
          assert 'sessionViewModel.updateProfileAvatar(uri)' in main, 'MainActivity still routes real avatar edits only to local Room profile'
          assert 'avatarPath = profile.userAvatarPath' in who, 'WhoWould user card lost real profile avatar'
          assert 'avatarPath = profile.partnerAvatarPath' in who, 'WhoWould partner card lost linked partner avatar'
          print('Profile avatar Supabase contract: PASS')
          PY
