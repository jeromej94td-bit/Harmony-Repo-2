name: Profile Avatar Contract TEMP

on:
  push:
    branches:
      - feature/profile-avatars-person-cards

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
      - name: Run profile avatar Supabase contract
        run: gradle :app:testDebugUnitTest --tests com.example.ProfileAvatarSupabaseSyncContractTest --stacktrace --no-daemon --no-configuration-cache
