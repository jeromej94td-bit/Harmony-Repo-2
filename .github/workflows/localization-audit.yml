name: Localization Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/main/java/com/example/ui/Language.kt'
      - 'app/src/main/java/com/example/ui/TranslationCatalog.kt'
      - 'app/src/main/java/com/example/ui/LocalizationUpdates.kt'
      - 'app/src/main/java/com/example/ui/introspection/IntrospectionStrings.kt'
      - 'app/src/main/java/com/example/ui/*Content.kt'
      - 'scripts/*locale*.py'
      - 'scripts/*localization*.py'
      - 'scripts/verify_language_inventory_guard.py'
      - 'scripts/verify_ptbr_ready.py'
      - 'scripts/repair_build_blockers.py'
      - '.github/workflows/localization-audit.yml'
  workflow_dispatch:

env:
  TARGET_REF: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: localization-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap PR guard. Full 41-locale generation is intentionally manual because it
  # fans out into many hosted-runner jobs and should not consume minutes for normal UI work.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - name: Verify generic generator regression
        run: python3 scripts/verify_production_locale_generator.py
      - name: Apply 41-locale scaffolding
        run: python3 scripts/scaffold_41_new_locales.py
      - name: Verify RTL app-language behavior
        run: python3 scripts/verify_rtl_locales.py

  generate-new-locales:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Translation requests share GitHub-hosted runner egress IPs. Serializing
      # locale batches prevents the public translation endpoint from rate-limiting
      # all eight batches at once and leaving shipped languages stale.
      max-parallel: 1
      matrix:
        include:
          - batch: europe-1
            codes: hu,ro,bg,uk,ru
          - batch: europe-rtl
            codes: el,tr,ar,he,fa
          - batch: south-asia-1
            codes: hi,bn,ur,ta,te
          - batch: south-asia-2
            codes: mr,gu,kn,ml,th
          - batch: southeast-asia
            codes: vi,id,ms,fil,my
          - batch: asia-africa
            codes: km,lo,sw,af,am
          - batch: africa
            codes: yo,ig,ha,zu,xh
          - batch: africa-europe-2
            codes: so,et,lv,lt,sl,sr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - name: Verify generic generator regression
        run: python3 scripts/verify_production_locale_generator.py
      - name: Apply 41-locale scaffolding
        run: python3 scripts/scaffold_41_new_locales.py
      - name: Generate locale batch
        run: python3 scripts/generate_production_locale_catalogs.py --codes "${{ matrix.codes }}" --artifact-dir build/generated-locales
      - name: Normalize generated Kotlin sources
        run: |
          python3 scripts/repair_generated_locale_sources.py
          for file in build/generated-locales/*.kt; do
            cp "app/src/main/java/com/example/ui/$(basename "$file")" "$file"
          done
      - name: Upload locale batch
        uses: actions/upload-artifact@v4
        with:
          name: production-locales-${{ matrix.batch }}
          path: build/generated-locales/*.kt
          if-no-files-found: error

  refresh-existing-locales:
    if: github.event_name == 'workflow_dispatch'
    needs: generate-new-locales
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - name: Refresh the 16 pre-41 production locales
        run: python3 scripts/refresh_existing_locale_catalogs.py --artifact-dir build/refreshed-locales
      - name: Upload refreshed existing locales
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-existing-locales
          path: build/refreshed-locales/*.kt
          if-no-files-found: error

  audit:
    if: github.event_name == 'workflow_dispatch'
    needs: [generate-new-locales, refresh-existing-locales]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - name: Apply existing six-locale scaffolding
        run: python3 scripts/scaffold_six_new_locales.py
      - name: Apply 41-locale scaffolding
        run: python3 scripts/scaffold_41_new_locales.py
      - name: Download generated 41-locale catalogs
        uses: actions/download-artifact@v4
        with:
          pattern: production-locales-*
          path: build/generated-locales
          merge-multiple: true
      - name: Download refreshed existing locales
        uses: actions/download-artifact@v4
        with:
          name: refreshed-existing-locales
          path: build/refreshed-locales
      - name: Install generated locale catalogs
        run: |
          cp build/generated-locales/*.kt app/src/main/java/com/example/ui/
          cp build/refreshed-locales/*.kt app/src/main/java/com/example/ui/
      - name: Normalize Kotlin locale sources
        run: |
          python3 scripts/repair_generated_locale_sources.py
          python3 scripts/repair_build_blockers.py
      - name: Verify generator regression
        run: python3 scripts/verify_production_locale_generator.py
      - name: Verify pt-BR readiness
        run: python3 scripts/verify_ptbr_ready.py
      - name: Verify existing six locales
        run: python3 scripts/verify_six_new_locales.py
      - name: Verify 41 new locales readiness
        run: python3 scripts/verify_41_new_locales.py
      - name: Verify RTL locales
        run: python3 scripts/verify_rtl_locales.py
      - name: Audit existing source catalogs
        run: python3 scripts/audit_localization.py
      - name: Audit 41 source catalogs
        run: python3 scripts/audit_41_locales.py
      - name: Verify existing effective localization
        run: python3 scripts/verify_localization_repair.py
      - name: Verify language inventory and cuisine links
        run: python3 scripts/verify_language_inventory_guard.py
      - name: Persist generated locale implementation
        run: |
          git config user.name "harmony-localization-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/MainActivity.kt
          git add app/src/main/java/com/example/ui/Language.kt
          git add app/src/main/java/com/example/ui/TranslationCatalog.kt
          git add app/src/main/java/com/example/ui/LocalizationUpdates.kt
          git add app/src/main/java/com/example/ui/introspection/IntrospectionStrings.kt
          git add app/src/main/java/com/example/ui/*Content.kt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh complete production locale catalogs"
            git push origin HEAD:${TARGET_REF}
          fi
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon
