name: Panda Category Artwork

on:
  push:
    branches:
      - main
      - fix/restore-premium-panda-category-artwork
      - fix/lock-original-panda-artwork
    paths:
      - 'app/src/main/java/com/example/ui/components/GameCategoryVisuals.kt'
      - 'app/src/main/res/drawable/panda_*_harmony.png'
      - 'app/src/main/res/drawable-nodpi/panda_*_harmony.png'
      - 'scripts/verify_panda_category_artwork.py'
      - 'scripts/repair_build_blockers.py'
      - '.github/workflows/panda-category-artwork.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/ui/components/GameCategoryVisuals.kt'
      - 'app/src/main/res/drawable/panda_*_harmony.png'
      - 'app/src/main/res/drawable-nodpi/panda_*_harmony.png'
      - 'scripts/verify_panda_category_artwork.py'
      - 'scripts/repair_build_blockers.py'
      - '.github/workflows/panda-category-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panda-category-artwork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify original premium panda category artwork
        run: python3 scripts/verify_panda_category_artwork.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --no-configuration-cache
