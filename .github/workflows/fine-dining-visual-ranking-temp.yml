name: Fine Dining Visual Ranking TEMP

on:
  push:
    branches:
      - feature/fine-dining-visual-ranking
    paths:
      - 'app/src/main/java/com/example/data/Harmony360FoodSectionCuration.kt'
      - 'app/src/main/java/com/example/ui/screens/FineDiningVisualRanking.kt'
      - 'app/src/main/java/com/example/ui/screens/RankingSlotBoard.kt'
      - 'app/src/main/res/drawable/fine_dining_ranking_atlas.webp'
      - 'app/src/test/java/com/example/ui/screens/FineDiningVisualRankingContractTest.kt'
      - '.github/workflows/fine-dining-visual-ranking-temp.yml'

permissions:
  contents: read

concurrency:
  group: fine-dining-visual-ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Inspect real Fine Dining atlas before Gradle
        run: |
          pwd
          ls -l app/src/main/res/drawable/fine_dining_ranking_atlas.webp
          wc -c app/src/main/res/drawable/fine_dining_ranking_atlas.webp

      - name: Verify Fine Dining visual ranking contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.screens.FineDiningVisualRankingContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache

      - name: Show focused test diagnostics
        if: failure()
        run: |
          find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -print || true
          cat app/build/test-results/testDebugUnitTest/TEST-com.example.ui.screens.FineDiningVisualRankingContractTest.xml || true
