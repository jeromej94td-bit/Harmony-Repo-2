name: Account Deletion Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/delete-account/**'
      - 'app/src/main/java/com/example/ui/session/SessionErrorCopy.kt'
      - 'app/src/test/java/com/example/ui/session/SessionErrorCopyTest.kt'
      - '.github/workflows/account-deletion-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-deletion-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Edge Function behavior
        run: node --test supabase/functions/delete-account/delete-account-core.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify safe Android error copy
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.session.SessionErrorCopyTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
