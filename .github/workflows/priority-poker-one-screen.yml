name: Priority Poker One Screen Regression

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/ui/screens/DirectPriorityPokerBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/QuestionOnlyMechanicShell.kt'
      - 'app/src/main/java/com/example/ui/screens/LargeOptionGridLayoutPolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenMechanicStageHeightPolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenQuestionMechanicBoard.kt'
      - 'app/src/test/java/com/example/ui/screens/PriorityPokerOneScreenContractTest.kt'
      - '.github/workflows/priority-poker-one-screen.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/com/example/ui/screens/DirectPriorityPokerBoard.kt'
      - 'app/src/main/java/com/example/ui/screens/QuestionOnlyMechanicShell.kt'
      - 'app/src/main/java/com/example/ui/screens/LargeOptionGridLayoutPolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenMechanicStageHeightPolicy.kt'
      - 'app/src/main/java/com/example/ui/screens/FullscreenQuestionMechanicBoard.kt'
      - 'app/src/test/java/com/example/ui/screens/PriorityPokerOneScreenContractTest.kt'
      - '.github/workflows/priority-poker-one-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: priority-poker-one-screen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare local app environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Verify one-screen priority poker contract
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.example.ui.screens.PriorityPokerOneScreenContractTest'
          --stacktrace
          --no-daemon
          --no-configuration-cache
